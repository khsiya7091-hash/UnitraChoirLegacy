<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UNITRA Choir Legacy Video</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        background: #f8f5f0;
        color: #1e1e1e;
      }
      .video-wrap {
        max-width: 1100px;
        margin: 4rem auto;
        padding: 2rem;
      }
      .video-box {
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
        padding: 1.5rem;
      }
      .video-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1.5rem;
        margin-top: 1.5rem;
      }
      .video-card {
        background: #f7f7f5;
        border-radius: 16px;
        padding: 1rem;
        border: 1px solid #e6e1d9;
      }
      video {
        width: 100%;
        max-height: 260px;
        border-radius: 12px;
        background: #000;
      }
      .back-link {
        display: inline-block;
        margin-top: 1rem;
        background: #0d7a3d;
        color: #fff;
        padding: 0.8rem 1.5rem;
        border-radius: 40px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="video-wrap">
      <div class="video-box">
        <h1 style="margin-bottom: 1rem;">UNITRA Choir Legacy Videos</h1>
        <div class="video-grid">
          <div class="video-card">
            <video controls preload="metadata">
              <source src="../images/WhatsApp%20Video%202026-08-21%20at%2019.52.31.mp4" type="video/mp4" />
              Your browser does not support the video tag.
            </video>
          </div>
          <div class="video-card">
            <video controls preload="metadata">
              <source src="../images/WhatsApp%20Video%202026-08-21%20at%2019.55.17.mp4" type="video/mp4" />
              Your browser does not support the video tag.
            </video>
          </div>
          <div class="video-card">
            <video controls preload="metadata">
              <source src="../images/WhatsApp%20Video%202026-08-21%20at%2019.56.21.mp4" type="video/mp4" />
              Your browser does not support the video tag.
            </video>
          </div>
          <div class="video-card">
            <video controls preload="metadata">
              <source src="../images/WhatsApp%20Video%202026-08-21%20at%2019.56.27.mp4" type="video/mp4" />
              Your browser does not support the video tag.
            </video>
          </div>
        </div>
        <div style="margin-top: 1rem;">
          <a href="index.html" class="back-link">Back to Home</a>
        </div>
      </div>
    </div>
  </body>
</html>
